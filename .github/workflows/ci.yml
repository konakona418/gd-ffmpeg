# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is automatically triggered for every push and pull request, to verify that everything still builds and passes the tests.

name: Continuous Integration
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/thirdparty/ffmpeg/linux-x86_64
      GODOT: ${{ github.workspace }}/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: thirdparty/ffmpeg
          key: ffmpeg-9.0.1-linux-x86_64-${{ hashFiles('thirdparty/build_ffmpeg.sh') }}

      - name: Build minimal LGPL FFmpeg
        run: bash thirdparty/build_ffmpeg.sh

      - name: Download Godot
        run: |
          mkdir -p godot
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q -o godot.zip -d godot
          chmod +x "$GODOT"

      - name: Build and run tests
        run: bash scripts/run_tests.sh
