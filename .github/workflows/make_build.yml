# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# This workflow is triggered manually on the "Actions" tab on GitHub, or by pushing
# a version tag, and produces the distributable addon zip.

name: Make a GDExtension build
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm scons zip

      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: thirdparty/ffmpeg
          key: ffmpeg-9.0.1-linux-x86_64-${{ hashFiles('thirdparty/build_ffmpeg.sh') }}

      - name: Build minimal LGPL FFmpeg
        run: bash thirdparty/build_ffmpeg.sh

      - name: Package addon
        run: bash scripts/package_addon.sh

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: gdffmpeg-linux-x86_64
          path: dist/gdffmpeg-linux-x86_64.zip
          if-no-files-found: error
